# nginx — ejemplo de despliegue del frontend (C9)
# Sirve dist/ y actúa como proxy inverso /api → Gateway (mismo origen).
# Sin scripts ni estilos de CDN; sin fuentes externas.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad obligatorias (todas las respuestas)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # HSTS solo si hay HTTPS (descomento al activar TLS)
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # SPA fallback: cualquier ruta no-API va a index.html (Vue Router history)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy inverso /api → Gateway (cambiar host:puerto según entorno)
  location /api/ {
    proxy_pass http://host.docker.internal:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Usuario $http_x_usuario;
  }
}
