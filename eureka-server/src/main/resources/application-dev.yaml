server:
  port: 8761

eureka:
  client:
    # El servidor NO se registra a si mismo ni consulta su propio registro
    register-with-eureka: false
    fetch-registry: false
  server:
    # dev: eliminar rapido instancias caidas, para ver fallas en clase
    enable-self-preservation: false
    wait-time-in-ms-when-sync-empty: 0

logging:
  level:
    com.netflix.eureka: INFO
