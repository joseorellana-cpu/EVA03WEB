server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # SIN StripPrefix: los controladores ya exponen /api/...
            - id: ms-proveedor
              uri: lb://MS-PROVEEDOR
              predicates:
                - Path=/api/proveedores/**
            - id: ms-producto
              uri: lb://MS-PRODUCTO
              predicates:
                - Path=/api/productos/**
            - id: ms-compra
              uri: lb://MS-COMPRA
              predicates:
                - Path=/api/compras/**
      # Timeouts del cliente HTTP interno del gateway
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
