server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:bd_proveedor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# Sin descubrimiento en pruebas: nada externo necesita Eureka
eureka:
  client:
    enabled: false
