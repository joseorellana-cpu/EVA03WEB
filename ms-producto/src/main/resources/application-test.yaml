server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:bd_producto;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# Timeouts rapidos: en pruebas no debe esperar a servicios inexistentes
spring.cloud:
  openfeign:
    client:
      config:
        default:
          connect-timeout: 500
          read-timeout: 1000

# Sin descubrimiento en pruebas: el cliente Feign se simula con @MockitoBean
eureka:
  client:
    enabled: false
