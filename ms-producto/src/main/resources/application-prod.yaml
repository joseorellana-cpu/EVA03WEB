server:
  port: ${MS_PRODUCTO_PORT:8082}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

spring.cloud:
  openfeign:
    client:
      config:
        default:
          connect-timeout: ${FEIGN_CONNECT_TIMEOUT:2000}
          read-timeout: ${FEIGN_READ_TIMEOUT:5000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true
