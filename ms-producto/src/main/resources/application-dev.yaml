server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bd_producto?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# OpenFeign: timeouts de conexion y lectura (tambien aplica por cliente si
# se define spring.cloud.openfeign.client.config.MS-PROVEEDOR.*)
spring.cloud:
  openfeign:
    client:
      config:
        default:
          connect-timeout: 2000
          read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
